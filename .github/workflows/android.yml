name: Build and release RED4U

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RED4U-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Decode signing key
        env:
          RED4U_KEYSTORE_BASE64: ${{ secrets.RED4U_KEYSTORE_BASE64 }}
        run: |
          echo "$RED4U_KEYSTORE_BASE64" | base64 --decode > red4u-release.jks
      - name: Build signed release
        env:
          RED4U_KEYSTORE_PATH: red4u-release.jks
          RED4U_STORE_PASSWORD: ${{ secrets.RED4U_STORE_PASSWORD }}
          RED4U_KEY_ALIAS: ${{ secrets.RED4U_KEY_ALIAS }}
          RED4U_KEY_PASSWORD: ${{ secrets.RED4U_KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Publish release for in-app updates
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
